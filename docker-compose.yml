
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: memify
      POSTGRES_USER: memify
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт наружу намеренно не публикуем (нет "ports:") — база доступна
    # только backend-контейнеру внутри внутренней сети docker compose.

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_JDBC_URL: jdbc:postgresql://db:5432/memify
      DB_USER: memify
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      YC_ACCESS_KEY_ID: ${YC_ACCESS_KEY_ID}
      YC_SECRET_KEY: ${YC_SECRET_KEY}

volumes:
  pgdata:
